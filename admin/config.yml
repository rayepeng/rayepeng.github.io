# 自托管写作后台配置 —— 部署在云服务器上，发布时由服务器 git push 到 GitHub。
# 注意：本目录在仓库根目录（不在 public/ 里），Astro 构建时不会发布到 GitHub Pages。

# 走 decap-server（proxy backend），而不是浏览器直连 GitHub。
# proxy_url 用同源相对路径：本地由 scripts/admin-dev.mjs 代理，线上由 nginx 代理，
# 两边配置完全一致，不需要按环境修改。
# 注意：decap-server 只负责 commit，push 由 scripts/git-hooks/post-commit 完成。
backend:
  name: proxy
  proxy_url: /api/v1
  branch: main

# 与你现有的图片存放方式对齐（图片与 md 同目录）
media_folder: src/content/posts
public_folder: ''

# 发布时使用的提交信息
commit_messages:
  create: 'post: 新建 {{collection}} {{slug}}'
  update: 'post: 更新 {{collection}} {{slug}}'
  delete: 'post: 删除 {{collection}} {{slug}}'
  uploadMedia: 'img: 上传 {{path}}'
  deleteMedia: 'img: 删除 {{path}}'

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    extension: md
    slug: '{{slug}}'
    preview_path: 'posts/{{slug}}'
    # 默认按发布时间倒序。Decap 默认是按 title 升序（不是按时间），
    # 必须显式声明。注意：整个集合里只能有一个字段带 default_sort。
    sortable_fields:
      - field: date
        default_sort: desc
      - title
    # 字段与 src/content/config.ts 的 posts schema 一一对应。
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 自定义 URL
        name: customSlug
        widget: string
        required: false
        hint: 留空则地址由文件名决定；填写后文章地址变为 /posts/<自定义值>/
      - label: 日期
        name: date
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        format: 'YYYY-MM-DD'
      - label: 更新日期
        name: updated
        widget: datetime
        required: false
        date_format: 'YYYY-MM-DD'
        time_format: false
        format: 'YYYY-MM-DD'
        hint: 可选。不填则文章页不显示"最后更新"
      - label: 分类
        name: category
        widget: string
        required: false
        default: 未分类
      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
      - label: 语言
        name: lang
        widget: select
        options: [zh, en]
        default: zh
      - label: 草稿
        name: draft
        widget: boolean
        default: true
        hint: 打开时文章不会出现在网站上
      - label: 封面图
        name: image
        widget: string
        required: false
        hint: 可填外链 URL，或与 md 同目录的相对路径（如 ./cover.jpg）
      - label: 描述
        name: description
        widget: text
        required: false
        hint: 用于列表摘要与 SEO description
      - label: 阅读时长
        name: duration
        widget: string
        required: false
        hint: 如 25min
      - label: 文章类型
        name: type
        widget: string
        required: false
        default: blog
        hint: blog 为普通文章；填 note 会出现在 /notes 页面
      - label: 重定向
        name: redirect
        widget: string
        required: false
        hint: 填写外部链接后，文章页会直接跳转到该地址（该文章不进 RSS）
      - label: 正文
        name: body
        widget: markdown
