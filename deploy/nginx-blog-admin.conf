# 写作后台的 nginx 站点。
# 只监听 127.0.0.1 —— 外部无法直连，必须经过 Cloudflare Tunnel + Access 才能进来。
# 如果改成 listen 80（0.0.0.0），后台会直接暴露在公网且没有任何鉴权，别这么干。
# 部署时脚本会把 __DOMAIN__ / __REPO_DIR__ 替换成实际值。

server {
    listen 127.0.0.1:80;
    server_name __DOMAIN__;

    # 后台是私有工具，别被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 后台界面（保持与仓库里的 admin/ 同步）
    root __REPO_DIR__/admin;
    index index.html;

    # 后台入口必须每次校验。
    # 注意：请求 / 会被 index 指令内部重定向到 /index.html 并重新匹配 location，
    # 所以只写 `location = /` 是拦不住的，两个都得写；否则 Cloudflare / 浏览器会缓存
    # 住 HTML，出现「新 HTML 引用旧 JS」的混搭，后台直接报错打不开编辑器。
    location = / {
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Decap 每次都要拉最新的集合配置，不能缓存
    location = /config.yml {
        default_type text/yaml;
        add_header Cache-Control "no-store";
    }

    # 后台依赖（decap-cms / Vditor），体积大且很少变动，交给浏览器长期缓存。
    # 用 ^~ 让它优先于下面的正则，不被 no-cache 规则盖掉。
    location ^~ /vendor/ {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # 后台自己的脚本随代码变化，必须每次校验，避免拿到旧版本
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # 后台依赖体积不小，开压缩能明显减少传输量
    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # 写作 API。decap-server 本身没有任何鉴权，
    # 所以这里只能通过本机访问，鉴权由前面的 Cloudflare Access 负责。
    location /api/v1 {
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
