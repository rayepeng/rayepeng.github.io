# 写作后台的 nginx 站点。
# 只监听 127.0.0.1 —— 外部无法直连，必须经过 Cloudflare Tunnel + Access 才能进来。
# 如果改成 listen 80（0.0.0.0），后台会直接暴露在公网且没有任何鉴权，别这么干。
# 部署时脚本会把 __DOMAIN__ / __REPO_DIR__ 替换成实际值。

server {
    listen 127.0.0.1:80;
    server_name __DOMAIN__;

    # 后台是私有工具，别被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 后台界面（保持与仓库里的 admin/ 同步）
    root __REPO_DIR__/admin;
    index index.html;

    location = / {
        add_header Cache-Control "no-store";
    }

    # Decap 每次都要拉最新的集合配置，不能缓存
    location = /config.yml {
        default_type text/yaml;
        add_header Cache-Control "no-store";
    }

    # 写作 API。decap-server 本身没有任何鉴权，
    # 所以这里只能通过本机访问，鉴权由前面的 Cloudflare Access 负责。
    location /api/v1 {
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
